<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | Dress Collection</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --dark: #111;
            --dark-soft: #292929;
            --text: #171717;
            --muted: #777;
            --border: #e5e5e5;
            --bg: #f6f7f9;
            --danger: #c62828;
            --danger-bg: #fff0f0;
            --success: #2e7d32;
            --success-bg: #effaf1;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 8% 5%,
                    rgba(17, 17, 17, 0.055),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 92% 12%,
                    rgba(17, 17, 17, 0.04),
                    transparent 28%
                ),
                var(--bg);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 35px 20px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           WRAPPER
        ========================= */

        .register-wrapper {
            width: 100%;
            max-width: 455px;
        }

        /* =========================
           BRAND
        ========================= */

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-icon {
            width: 72px;
            height: 72px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 21px;

            background: var(--dark);
            color: white;

            font-size: 34px;

            box-shadow:
                0 13px 30px rgba(0, 0, 0, 0.14);
        }

        .brand h1 {
            margin-bottom: 6px;

            font-size: 29px;
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        .brand p {
            color: var(--muted);
            font-size: 13px;
        }

        /* =========================
           CARD
        ========================= */

        .register-card {
            background: rgba(255, 255, 255, 0.94);

            border: 1px solid rgba(0, 0, 0, 0.07);
            border-radius: 23px;

            padding: 34px;

            box-shadow:
                0 20px 55px rgba(0, 0, 0, 0.08);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .card-heading {
            margin-bottom: 25px;
        }

        .card-eyebrow {
            display: inline-flex;

            margin-bottom: 11px;
            padding: 6px 10px;

            border-radius: 999px;

            background: #f0f0f0;
            color: #555;

            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.1px;
            text-transform: uppercase;
        }

        .register-card h2 {
            margin-bottom: 7px;

            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .description {
            color: var(--muted);

            font-size: 13px;
            line-height: 1.55;
        }

        /* =========================
           MESSAGES
        ========================= */

        .message {
            padding: 12px 13px;

            border-radius: 11px;

            font-size: 12px;
            line-height: 1.5;

            margin-bottom: 16px;
        }

        .message.error {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid #ffd0d0;
        }

        .message.success {
            background: var(--success-bg);
            color: var(--success);
            border: 1px solid #c8e6c9;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 19px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #333;

            font-size: 13px;
            font-weight: 750;
        }

        .form-group input {
            width: 100%;
            height: 50px;

            padding: 0 14px;

            border: 1px solid #d8d8d8;
            border-radius: 12px;

            background: white;
            color: #222;

            outline: none;

            font-family: inherit;
            font-size: 15px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .form-group input:focus {
            border-color: #111;

            box-shadow:
                0 0 0 4px rgba(0, 0, 0, 0.055);

            transform: translateY(-1px);
        }

        /* =========================
           REGISTER BUTTON
        ========================= */

        .register-btn {
            width: 100%;
            height: 51px;

            margin-top: 3px;

            border: 1px solid var(--dark);
            border-radius: 12px;

            background: var(--dark);
            color: white;

            font-family: inherit;
            font-size: 14px;
            font-weight: 750;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.14);

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .register-btn:hover {
            background: var(--dark-soft);

            transform: translateY(-2px);

            box-shadow:
                0 11px 25px rgba(0, 0, 0, 0.18);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        .register-btn:disabled {
            opacity: 0.65;
            cursor: wait;
            transform: none;
        }

        /* =========================
           LOGIN LINK
        ========================= */

        .login-link {
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 43px;

            margin-top: 22px;

            border: 1px solid #dedede;
            border-radius: 10px;

            background: white;
            color: #555;

            font-size: 13px;
            font-weight: 650;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .login-link:hover {
            background: #f5f5f5;
            color: #111;
            transform: translateY(-1px);
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;

            color: #999;
            font-size: 11px;

            margin-top: 20px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {
            body {
                padding: 20px 13px;
                align-items: flex-start;
            }

            .register-wrapper {
                margin-top: 12px;
            }

            .brand {
                margin-bottom: 20px;
            }

            .brand-icon {
                width: 62px;
                height: 62px;

                margin-bottom: 12px;

                border-radius: 18px;
                font-size: 29px;
            }

            .brand h1 {
                font-size: 25px;
            }

            .brand p {
                font-size: 12px;
            }

            .register-card {
                padding: 25px 19px;
                border-radius: 18px;
            }

            .card-eyebrow {
                font-size: 8px;
            }

            .register-card h2 {
                font-size: 21px;
            }

            .description {
                font-size: 12px;
            }

            .form-group input {
                height: 49px;
                font-size: 16px;
            }

            .register-btn {
                height: 50px;
            }

            .login-link {
                min-height: 46px;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 14px 9px;
            }

            .register-wrapper {
                margin-top: 4px;
            }

            .register-card {
                padding: 22px 15px;
            }

            .brand h1 {
                font-size: 23px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="register-wrapper">

        <!-- BRAND -->

        <div class="brand">

            <div class="brand-icon">
                👗
            </div>

            <h1>
                Dress Collection
            </h1>

            <p>
                Dress Collection Management System
            </p>

        </div>


        <!-- REGISTER CARD -->

        <div class="register-card">

            <div class="card-heading">

                <div class="card-eyebrow">
                    New Account
                </div>

                <h2>
                    Create Account
                </h2>

                <p class="description">
                    Create your personal Dress Collection account.
                </p>

            </div>


            <!-- MESSAGES -->

            {% if messages %}

                {% for message in messages %}

                    <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            <!-- FORM -->

            <form
                method="post"
                action="{% url 'register' %}"
                id="registerForm"
            >

                {% csrf_token %}


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        autocomplete="username"
                        required
                        autofocus
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="register-btn"
                    id="registerButton"
                >
                    Create Account →
                </button>

            </form>


            <!-- LOGIN LINK -->

            <a
                href="{% url 'login' %}"
                class="login-link"
            >
                ← Already have an account? Login
            </a>

        </div>


        <div class="footer">
            Dress Collection © 2026
        </div>

    </div>


    <script>
        const registerForm =
            document.getElementById("registerForm");

        if (registerForm) {

            registerForm.addEventListener(
                "submit",
                function () {

                    const button =
                        document.getElementById("registerButton");

                    if (button) {
                        button.disabled = true;
                        button.textContent = "Creating Account...";
                    }

                }
            );

        }
    </script>

</body>

</html>
